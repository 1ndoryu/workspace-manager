<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Workspace Manager</title>
    <style>
      /* Pantalla de aviso: se ve justo cuando la API no esta, asi que no puede
         depender del front ni de red. Estilo propio, sin fuentes externas. */
      html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e8ee;
        font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 12vh 24px; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { color: #a7adbb; margin: 0 0 18px; }
      code { background: #1b1f27; padding: 2px 6px; border-radius: 4px; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 6px;
        padding: 9px 16px; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      pre { background: #1b1f27; padding: 12px; border-radius: 6px; overflow: auto;
        font-size: 13px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>El backend del tablero no responde</h1>
      <p>
        La ventana esta viva, pero la API del portatil en el puerto 8787 no
        contesta. El backend necesita <code>node</code> en el PATH y la carpeta
        del repo con <code>dist-server</code> compilado.
      </p>
      <p id="ruta"></p>
      <button id="reintentar">Reintentar</button>
      <pre id="detalle" hidden></pre>
    </main>
    <script>
      const boton = document.getElementById('reintentar');
      /* [por qué no se rinde] Al abrir la app el backend suele estar levantándose,
       * así que se prueba cada 2 s; si tarda más, el intervalo crece hasta 10 s en
       * vez de parar. Antes paraba a los 120 s y la ventana se quedaba en el aviso
       * para siempre aunque el backend apareciera después (F4 de 20AA-24). */
      const detalle = document.getElementById('detalle');
      let espera = 2000;
      let intentos = 0;
      let vivo = true;
      const probar = async () => {
        if (!vivo) return;
        intentos += 1;
        try {
          const r = await fetch('/__reintentar');
          const datos = await r.json();
          if (datos.backend) { vivo = false; location.href = '/'; return; }
        } catch { /* sigue intentándolo */ }
        /* A partir del minuto se dice que sigue esperando y por qué. */
        if (intentos === 30) {
          detalle.hidden = false;
          detalle.textContent = 'Sigue esperando al backend; se reintenta solo, cada vez menos seguido.';
        }
        espera = Math.min(espera * 1.25, 10000);
        setTimeout(probar, espera);
      };
      setTimeout(probar, espera);
      boton.addEventListener('click', async () => {
        boton.disabled = true;
        boton.textContent = 'Reintentando...';
        try {
          const r = await fetch('/__reintentar');
          const datos = await r.json();
          if (datos.backend) { location.href = '/'; return; }
          detalle.hidden = false;
          detalle.textContent = datos.detalle || 'sigue sin responder';
        } catch (e) {
          detalle.hidden = false;
          detalle.textContent = String(e);
        }
        boton.disabled = false;
        boton.textContent = 'Reintentar';
      });
    </script>
  </body>
</html>
