[package]
name = "workspace-manager"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Servidor local: sirve el front empotrado y hace de proxy de /api. Lo mas
# liviano que hace las dos cosas sin arrastrar un framework web entero.
tiny_http = "0.12"
# Cliente del proxy. Sin TLS: todo va por 127.0.0.1 (el backend del portatil).
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
